name: Nexus Launcher APK Build

on:
  push:
    branches: [ v3_openjdk, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore truncated Java sources + Nexus home ROOT
        run: |
          GOOD=7cfebef2850567e7b9b579d1de6bfbe9a7b2bdff

          restore_if_small() {
            local FILE="$1"
            local SIZE
            SIZE=$(wc -c < "$FILE" | tr -d ' ')
            echo "$FILE size=$SIZE"
            if [ "$SIZE" -lt 5000 ]; then
              echo "Restoring $FILE from $GOOD..."
              git show "$GOOD:$FILE" > "$FILE"
              echo "Restored ($(wc -c < "$FILE") bytes)"
            fi
          }

          LA="app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/LauncherActivity.java"
          MM="app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/fragments/MainMenuFragment.java"
          restore_if_small "$LA"
          restore_if_small "$MM"

          # Force Nexus home as ROOT fragment
          sed -i 's/MainMenuFragment\.class, null, "ROOT"/NexusHomeFragment.class, null, "ROOT"/g' "$LA"
          sed -i 's/if (!(fragment instanceof MainMenuFragment))/if (!(fragment instanceof MainMenuFragment) \&\& !(fragment instanceof NexusHomeFragment))/g' "$LA"
          sed -i 's/if (fragment instanceof MainMenuFragment) {/if (fragment instanceof MainMenuFragment || fragment instanceof NexusHomeFragment) {/g' "$LA"
          echo "--- ROOT lines ---"
          grep -n 'ROOT\|NexusHome' "$LA" | head -15

      - name: Rebrand Battly loading screen -> Nexus
        run: |
          STR="app_pojavlauncher/src/main/res/values/strings.xml"
          sed -i 's/>Battly Launcher</>Nexus Launcher PRO</g' "$STR"
          sed -i 's/Battly is preparing everything/Nexus is preparing everything/g' "$STR"
          sed -i 's/>Preparing Minecraft</>Nexus is preparing Minecraft</g' "$STR"
          sed -i 's/>Battly Workspace</>Nexus Workspace</g' "$STR"
          sed -i 's/Battly Launcher has unexpectedly crashed/Nexus Launcher PRO has unexpectedly crashed/g' "$STR"
          sed -i 's/Enjoy your game\. Battly/Enjoy your game. Nexus/g' "$STR"
          echo "Branding sample:"
          grep -n 'app_name\|launcher_starting_minecraft_enjoy\|launcher_starting_hint' "$STR" | head -10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;28.2.13676358" || sdkmanager --install "ndk;27.0.12077973" || true

      - name: Ensure release google-services.json present
        run: |
          mkdir -p app_pojavlauncher/src/release
          if [ ! -f app_pojavlauncher/src/release/google-services.json ]; then
            echo "ERROR: app_pojavlauncher/src/release/google-services.json missing"
            echo "Put your Firebase file there with package_name: com.nexuslauncher"
            exit 1
          fi
          ls -la app_pojavlauncher/src/release/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app_pojavlauncher:assembleRelease --console=plain --stacktrace
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusLauncher-release
          path: app_pojavlauncher/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: List APK files
        if: always()
        run: find app_pojavlauncher/build/outputs -name "*.apk" -type f || true
