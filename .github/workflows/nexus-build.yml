name: Nexus Launcher APK Build

on:
  push:
    branches: [ v3_openjdk, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;28.2.13676358" || sdkmanager --install "ndk;27.0.12077973" || true

      - name: Ensure google-services.json present
        run: |
          mkdir -p app_pojavlauncher/src/debug app_pojavlauncher/src/release
          if [ ! -f app_pojavlauncher/src/debug/google-services.json ]; then
            if [ -f app_pojavlauncher/src/debug/google-services.example.json ]; then
              cp app_pojavlauncher/src/debug/google-services.example.json app_pojavlauncher/src/debug/google-services.json
            fi
          fi
          if [ ! -f app_pojavlauncher/src/release/google-services.json ]; then
            if [ -f app_pojavlauncher/src/release/google-services.example.json ]; then
              cp app_pojavlauncher/src/release/google-services.example.json app_pojavlauncher/src/release/google-services.json
            fi
          fi
          ls -la app_pojavlauncher/src/debug/google-services.json app_pojavlauncher/src/release/google-services.json || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --console=plain --stacktrace
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusLauncher-debug
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: List APK files
        if: always()
        run: find app_pojavlauncher/build/outputs -name "*.apk" -type f || true
